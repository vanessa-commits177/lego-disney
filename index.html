<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi LEGO Disney</title>
<style>
:root{--bg:#eef1f5;--ink:#14202b;--mute:#5b6b7a;--line:#cfd7e0;--card:#fff;--soon:#b3261e;--mid:#9a6200}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--ink:#e6edf3;--mute:#93a3b3;--line:#27333f;--card:#16212c;--soon:#ff8a80;--mid:#f2b45a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 16px;color:var(--mute)}
.bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{cursor:pointer;position:sticky;top:0;background:var(--card);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.soon{color:var(--soon);font-weight:600}.mid{color:var(--mid);font-weight:600}
small{color:var(--mute)}
#promos{margin:0 0 16px}#promos b{color:var(--soon)}
:focus-visible{outline:2px solid var(--soon);outline-offset:2px}
</style>
</head>
<body>
<h1>Suivi LEGO Disney</h1>
<p class="sub" id="maj">Chargement…</p>
<div id="promos"></div>
<div class="bar">
  <input id="q" placeholder="Rechercher un set ou un numéro" aria-label="Rechercher">
  <select id="f" aria-label="Filtrer">
    <option value="">Tous les sets</option>
    <option value="exit">Retrait annoncé</option>
    <option value="soon">Retrait dans moins de 6 mois</option>
  </select>
</div>
<div class="wrap"><table>
<thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
<p><small>Annonces : eBay.fr, vendeurs situés en France. « Vendues (7 j) » compte les annonces visibles hier et disparues aujourd’hui : c’est une estimation, qui inclut aussi les retraits d’annonces.</small></p>
<script>
const COLS=[
 ["num","Set",r=>r.num],["name","Nom",r=>r.name],
 ["launch","Sortie",r=>r.launch||"—"],["exit","Retrait annoncé",r=>r.exit||"—"],
 ["rrp","Prix LEGO (€)",r=>r.rrp?.toFixed?.(2)??"—"],
 ["nc","Neuf : annonces",r=>r.new.count??"—"],["nm","Neuf : min (€)",r=>r.new.min?.toFixed(2)??"—"],
 ["n7","Neuf vendus (7 j)",r=>r.new.gone7],
 ["uc","Occasion : annonces",r=>r.used.count??"—"],["um","Occasion : min (€)",r=>r.used.min?.toFixed(2)??"—"],
 ["u7","Occasion vendus (7 j)",r=>r.used.gone7]];
const SORT={num:r=>r.num,name:r=>r.name,launch:r=>r.launch||"",exit:r=>r.exit||"9999",rrp:r=>r.rrp||0,
 nc:r=>r.new.count??-1,nm:r=>r.new.min??1e9,n7:r=>r.new.gone7,uc:r=>r.used.count??-1,um:r=>r.used.min??1e9,u7:r=>r.used.gone7};
let rows=[],key="exit",dir=1;
const months=d=>d?(new Date(d)-new Date())/2.6298e9:null;
function draw(){
 const q=document.getElementById("q").value.toLowerCase(),f=document.getElementById("f").value;
 let v=rows.filter(r=>(r.num+r.name).toLowerCase().includes(q)&&(!f||(f=="exit"?r.exit:(r.exit&&months(r.exit)<=6))));
 v.sort((a,b)=>{const x=SORT[key](a),y=SORT[key](b);return (x>y?1:x<y?-1:0)*dir});
 document.getElementById("body").innerHTML=v.map(r=>"<tr>"+COLS.map(([k,,g],i)=>{
  let c=i<4?"":" class=n",val=g(r);
  if(k=="exit"&&r.exit){const m=months(r.exit);c=m<=3?" class=soon":m<=6?" class=mid":"";}
  return `<td${c}>${val}</td>`}).join("")+"</tr>").join("");
}
fetch("data.json").then(r=>r.json()).then(d=>{
 rows=d.sets;document.getElementById("maj").textContent=`${rows.length} sets · mise à jour du ${d.updated}`;
 document.getElementById("head").innerHTML=COLS.map(([k,t])=>`<th data-k="${k}" tabindex="0">${t}</th>`).join("");
 document.querySelectorAll("th").forEach(th=>{const go=()=>{key==th.dataset.k?dir*=-1:(key=th.dataset.k,dir=1);draw()};
  th.onclick=go;th.onkeydown=e=>e.key=="Enter"&&go()});
 draw();
}).catch(()=>document.getElementById("maj").textContent="Aucune donnée pour l’instant : lancez la mise à jour une première fois.");
fetch("promos.json").then(r=>r.json()).then(p=>{
 const e=s=>String(s).replace(/[<>&"]/g,"");
 const top=p.items.filter(i=>i.pct>=25).sort((a,b)=>b.pct-a.pct).slice(0,10);
 if(top.length)document.getElementById("promos").innerHTML=`<b>Promos du jour</b> (relevé du ${e(p.updated)})<br>`+top.map(i=>`${e(i.num)} ${e(i.name)} : ${i.price.toFixed(2)} € chez ${e(i.shop)} (−${i.pct} % sur ${i.rrp.toFixed(2)} €)`).join("<br>");
}).catch(()=>{});
document.getElementById("q").oninput=draw;document.getElementById("f").onchange=draw;
</script>
</body>
</html>
